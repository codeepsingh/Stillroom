name: Stillroom checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Compact
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify compiler version
        run: compact compile --version | grep -E '(^|[^0-9])0\.31\.0($|[^0-9])'
      - name: Compile all contract circuits and copy assets
        run: npm run compile
      - name: Verify generated browser assets
        run: npm run verify:assets
      - name: Run compiled-contract and application tests
        run: npm test
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Retain build
        uses: actions/upload-artifact@v4
        with:
          name: stillroom-site
          path: dist/
          retention-days: 7
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
